services:
  e2m-core:
    image: ${E2M_CORE_IMAGE:?set E2M_CORE_IMAGE to a published e2m-core image}
    environment:
      E2M_CORE_ADDR: ":8080"
      E2M_CORE_PUBLIC_URL: "${E2M_CORE_PUBLIC_URL:?set E2M_CORE_PUBLIC_URL}"
      # Keep experimental recommendations and forward writes closed by default.
      E2M_UPSTREAM_RECOMMENDATIONS: "${E2M_UPSTREAM_RECOMMENDATIONS:-false}"
      E2M_UPSTREAM_OPTIMIZATION_AUTO_APPLY: "${E2M_UPSTREAM_OPTIMIZATION_AUTO_APPLY:-false}"
      E2M_RECOMMENDATION_ROLLOUT_OBSERVATION: "${E2M_RECOMMENDATION_ROLLOUT_OBSERVATION:-5m}"
      E2M_RECOMMENDATION_ROLLOUT_WORKER_INTERVAL: "${E2M_RECOMMENDATION_ROLLOUT_WORKER_INTERVAL:-1s}"
      E2M_RECOMMENDATION_ROLLOUT_WORKER_LEASE: "${E2M_RECOMMENDATION_ROLLOUT_WORKER_LEASE:-2m}"
      E2M_RECOMMENDATION_ROLLOUT_RUNNER_INTERVAL: "${E2M_RECOMMENDATION_ROLLOUT_RUNNER_INTERVAL:-1s}"
    ports:
      - "${E2M_CORE_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  connector:
    profiles: ["connector"]
    image: ${E2M_CONNECTOR_IMAGE:-ghcr.io/jerrry030/e2m-agent:latest}
    depends_on:
      e2m-core:
        condition: service_healthy
    environment:
      E2M_CORE_URL: "${E2M_CONNECTOR_CORE_URL:-}"
      E2M_CONNECTOR_ID: "${E2M_CONNECTOR_ID:-}"
      E2M_INSTANCE_ID: "${E2M_INSTANCE_ID:-}"
      E2M_CONNECTOR_ENABLED: "true"
      E2M_CONNECTOR_ENROLL_TOKEN_FILE: "/run/secrets/e2m_connector_enrollment"
      E2M_CONNECTOR_TOKEN_FILE: "/var/lib/e2m-agent/connector.token"
      E2M_CONNECTOR_IDENTITY_FILE: "/var/lib/e2m-agent/connector-identity.json"
      E2M_LOCAL_UI_ADDR: "0.0.0.0:18081"
      E2M_LOCAL_UI_ALLOW_PRIVATE_PEERS: "true"
    ports:
      - "127.0.0.1:${E2M_CONNECTOR_UI_PORT:-18081}:18081"
    volumes:
      - e2m-connector-data:/var/lib/e2m-agent
    secrets:
      - e2m_connector_enrollment

volumes:
  e2m-connector-data:

secrets:
  e2m_connector_enrollment:
    file: "${E2M_CONNECTOR_ENROLLMENT_FILE:-./secrets/e2m-connector-enrollment-token}"
