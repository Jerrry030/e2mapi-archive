services:
  e2m-core:
    build:
      context: ../../..
      dockerfile: app/e2m-core/Dockerfile
    image: e2m-core:dev
    environment:
      E2M_CORE_ADDR: ":8080"
      E2M_CORE_PUBLIC_URL: "http://localhost:8080"
      # Recommendation APIs and forward traffic mutation are fail-closed.
      E2M_UPSTREAM_RECOMMENDATIONS: "false"
      E2M_UPSTREAM_OPTIMIZATION_AUTO_APPLY: "false"
      E2M_RECOMMENDATION_ROLLOUT_OBSERVATION: "5m"
      E2M_RECOMMENDATION_ROLLOUT_WORKER_INTERVAL: "1s"
      E2M_RECOMMENDATION_ROLLOUT_WORKER_LEASE: "2m"
      E2M_RECOMMENDATION_ROLLOUT_RUNNER_INTERVAL: "1s"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  connector:
    profiles: ["connector"]
    build:
      context: ../../..
      dockerfile: app/e2m-agent/Dockerfile
    image: e2m-agent:dev
    depends_on:
      e2m-core:
        condition: service_healthy
    environment:
      E2M_CORE_URL: "http://e2m-core:8080"
      E2M_CONNECTOR_ID: "${E2M_CONNECTOR_ID:-}"
      E2M_INSTANCE_ID: "${E2M_INSTANCE_ID:-}"
      E2M_CONNECTOR_ENABLED: "true"
      E2M_CONNECTOR_ENROLL_TOKEN_FILE: "/run/secrets/e2m_connector_enrollment"
      E2M_CONNECTOR_TOKEN_FILE: "/var/lib/e2m-agent/connector.token"
      E2M_CONNECTOR_IDENTITY_FILE: "/var/lib/e2m-agent/connector-identity.json"
      E2M_LOCAL_UI_ADDR: "0.0.0.0:18081"
      E2M_LOCAL_UI_ALLOW_PRIVATE_PEERS: "true"
    ports:
      - "127.0.0.1:${E2M_CONNECTOR_UI_PORT:-18081}:18081"
    volumes:
      - e2m-connector-data:/var/lib/e2m-agent
    secrets:
      - e2m_connector_enrollment

volumes:
  e2m-connector-data:

secrets:
  e2m_connector_enrollment:
    file: "${E2M_CONNECTOR_ENROLLMENT_FILE:-./secrets/e2m-connector-enrollment-token}"
