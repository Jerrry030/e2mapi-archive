host: ""
port: 8317

tls:
  enable: false
  cert: ""
  key: ""

remote-management:
  allow-remote: true
  secret-key: "admin123456"
  disable-control-panel: true
  disable-auto-update-panel: true
  panel-github-repository: "https://github.com/router-for-me/Cli-Proxy-API-Management-Center"

auth-dir: "~/.cli-proxy-api"

api-keys:
  - "e2m-cpa-local-api-key"

debug: false

pprof:
  enable: false
  addr: "127.0.0.1:8316"

plugins:
  enabled: false
  dir: "plugins"
  configs: {}

commercial-mode: false
logging-to-file: false
logs-max-total-size-mb: 0
# Required only when the CPA Connector's local
# cpa_usage_statistics_enabled switch is also enabled. Keeping both sides
# explicit prevents a deployment from silently consuming the destructive
# usage queue.
usage-statistics-enabled: true
proxy-url: ""
request-retry: 1

claude:
  enabled: true
  keys: []

openai:
  enabled: true
  keys: []

gemini:
  enabled: true
  keys: []

codex:
  enabled: true
  keys: []
