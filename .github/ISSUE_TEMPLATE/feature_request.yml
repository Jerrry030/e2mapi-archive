name: Feature Request
description: 提出功能建议或改进方向
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 背景/问题
      description: 说明为什么需要这个功能。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述你希望的行为或接口。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
    validations:
      required: false
